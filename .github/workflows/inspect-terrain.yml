name: Inspect map terrain tiles
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow numpy
      - name: Classify grid centers
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          im=np.array(Image.open('IMG_1359.jpeg').convert('RGB')).astype(float)
          xs=[257,314.4,371.8,429.2,486.6,544,601.4,658.8,716.2,773.6,831,888.4,945.8,1003.2,1060.6,1118]
          ys=[78,136.2,194.3,252.5,310.6,368.8,426.9,485.1,543.2,601.4,659.5,717.7,775.8,834]
          for ri,(y0,y1) in enumerate(zip(ys,ys[1:])):
            row=[]
            for ci,(x0,x1) in enumerate(zip(xs,xs[1:])):
              # Sample inner 60% of each tile, away from printed grid lines.
              xx=np.linspace(x0+(x1-x0)*.2,x1-(x1-x0)*.2,9).astype(int)
              yy=np.linspace(y0+(y1-y0)*.2,y1-(y1-y0)*.2,9).astype(int)
              p=im[np.ix_(yy,xx)]
              R,G,B=p[:,:,0],p[:,:,1],p[:,:,2]
              green=(G>R*1.08)&(G>B*1.02)&(G>48)&(G<220)&((G-np.minimum(R,B))>10)
              # report green coverage, center pixel and average
              q=p[4,4].astype(int)
              row.append(f"{green.mean():.2f}:{q[0]},{q[1]},{q[2]}")
            print(f"ROW{ri:02d} "+" | ".join(row))
          PY
