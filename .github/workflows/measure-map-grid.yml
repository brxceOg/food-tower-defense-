name: Measure battlefield grid
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/measure-map-grid.yml'
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - name: Measure source grid lines
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          im=np.array(Image.open('IMG_1359.jpeg').convert('RGB')).astype(float)
          h,w,_=im.shape
          print('SOURCE_SIZE',w,h)
          # Candidate grid is the visible grassy board; score dark olive grid strokes.
          # Print local darkness/green-line contrast projections so actual line centers can be read.
          x0,x1=int(w*.18),int(w*.96)
          y0,y1=int(h*.07),int(h*.99)
          a=im[y0:y1,x0:x1]
          # Grid strokes are darker/less saturated than adjacent grass. Compare each row/column
          # against a 3-pixel neighborhood to suppress broad scene features.
          def peaks(vals,lo,hi):
              order=sorted(range(lo,hi),key=lambda i: vals[i],reverse=True)
              chosen=[]
              for i in order:
                  if all(abs(i-j)>3 for j in chosen):
                      chosen.append(i)
                  if len(chosen)>=24: break
              return [(i,round(float(vals[i]),2)) for i in sorted(chosen)]
          # dark pixel fraction and local contrast
          gray=im.mean(axis=2)
          dark=(gray<95).astype(float)
          for name,arr,lo,hi in [('X',dark.sum(axis=0),x0,x1),('Y',dark.sum(axis=1),y0,y1)]:
              print(name+'_DARK_PEAKS',peaks(arr,lo,hi))
          # strongest adjacent-row/column mean-color discontinuities
          for axis,name,lo,hi in [(0,'X_EDGE',x0,x1),(1,'Y_EDGE',y0,y1)]:
              means=im.mean(axis=axis)
              dif=np.linalg.norm(np.diff(means,axis=0),axis=1)
              print(name+'_EDGE_PEAKS',peaks(dif,lo,hi))
          PY
